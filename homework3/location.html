<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location Awareness</title>
  <meta name="description" content="Using geolocation API to request and receive the user's physical coordinate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Lora&family=Inter">
  <style type="text/tailwindcss">
    @theme {
      --color-gold: #F5A623;
      --color-terracotta: #D9735A;
      --color-cream: #F9F2E7;
      --color-linen: #EDE4D8;
      --color-walnut: #3D2B1F;
      --font-heading: 'Lora', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
  </style>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
  <!-- Leaflet Javascript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin="">
  </script>
</head>

<body class="bg-cream text-walnut font-body">

<!-- Navigation -->
<header class="sticky top-0 z-50 bg-cream shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

    <!-- Logo -->
    <a href="index.html" class="font-heading text-2xl font-bold text-gold tracking-tight">
      Lumi <span class="text-walnut">Toys</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-walnut">
      <a href="products.html" class="hover:text-gold transition-colors">Products</a>
      <a href="contact.html" class="hover:text-gold transition-colors">Contact</a>
      <a href="location.html" class="hover:text-gold transition-colors">Location</a>
      <a href="extra.html" class="hover:text-gold transition-colors">Extra</a>
    </nav>

    <!-- Hamburger Button -->
    <button id="menu-btn" class="md:hidden p-2 rounded-lg hover:bg-linen transition-colors" aria-label="Toggle navigation">
      <svg id="icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-5 h-5 fill-walnut"><path d="M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z"/></svg>
      <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="w-5 h-5 fill-walnut hidden"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></svg>
    </button>
  </div>
  
  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-cream border-t border-linen px-4 pb-6 pt-2 flex flex-col gap-4 text-sm font-medium">
    <a href="products.html" class="text-right">Products</a>
    <a href="contact.html" class="text-right">Contact</a>
    <a href="location.html" class="text-right">Location</a>
    <a href="extra.html" class="text-right">Extra</a>
  </div>
   
</header>

<main>
  <!-- Banner Section -->
  <section class="relative min-h-[25vh] flex items-center justify-center overflow-hidden py-4 md:py-4">

    <div class="absolute inset-0 bg-linen"></div>

    <div class="relative z-10 text-center px-4 max-w-3xl mx-auto">
      <h1 class="font-heading text-4xl md:text-5xl lg:text-6xl font-extrabold leading-tight text-gol mb-6"><span class="border-b-6 border-gold">Location</span> Awareness</h1>
      <p id="user-location" class="text-lg md:text-xl text-walnut mb-8">Detecting your coordinates, pleaes ensure location access is enabled.</p>
    </div>
  </section>

  <!-- Leaflet Map -->
  <div id="map" class="overflow-hidden border border-linen w-full h-screen">
  </div>
  
</main>

<!-- Footer -->
<footer class="bg-gold px-4 py-6">
  <p class="text-center text-s text-walnut/80">&copy; 2025 Lumi Toys. All rights reserved.</p>
</footer>

<script>
  const btn = document.getElementById('menu-btn');
  const menu = document.getElementById('mobile-menu');
  const iconOpen = document.getElementById('icon-open');
  const iconClose = document.getElementById('icon-close');

  btn.addEventListener('click', () => {
    const isHidden = menu.classList.toggle('hidden');
    iconOpen.classList.toggle('hidden', !isHidden);
    iconClose.classList.toggle('hidden', isHidden);
  });
</script>

<script>
  var map = L.map('map', {
    minZoom: 9,
    maxZoom: 18,
    zoom: 12,
    center: [37.7897, -122.3972],
    doubleClickZoom: false,
  }).locate({setView: true});

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);

  map.on('locationfound', function(e) {
    var lat = e.latlng.lat.toFixed(6);
  var lng = e.latlng.lng.toFixed(6);

  document.getElementById('user-location').textContent = `Your coordinates are ${lat}, ${lng}`;
    var marker = L.marker(e.latlng).addTo(map);
    
    marker.bindTooltip('You are here!', {
      permanent: false,  
      direction: 'top',
      offset: [-15, -10]
    });
  });       
    
</script>

</body>
</html>
